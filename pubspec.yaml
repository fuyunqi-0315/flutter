name: untitled
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.1  # 修改为这个版本
  path_provider: ^2.1.1
#  sqflite_common_ffi: ^2.3.0
  dio: ^4.0.4
  image_picker: ^1.0.4
  supabase_flutter: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:

# ↓↓↓↓↓ 以下是我安全添加的，完全不影响你原有功能 ↓↓↓↓↓
codemagic:
  workflows:
    build-app:
      name: Build Android & macOS
      environment:
        flutter: stable
        xcode: latest
      scripts:
        - flutter pub get
        - flutter build apk --debug
        - flutter build macos --debug
      artifacts:
        - build/app/outputs/flutter-apk/app-debug.apk
        - build/macos/Build/Products/Debug/*.zip