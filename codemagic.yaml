workflows:
  build-all:
    name: Build Android APK + macOS App
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      # 初始化环境
      - flutter config --enable-macos-desktop
      - flutter pub get

      # 构建安卓 APK（手机直接安装）
      - flutter build apk --debug

      # 构建 macOS（虚拟机直接运行）
      - flutter build macos --release --arch x86_64
      - cd build/macos/Build/Products/Release
      - zip -r app.zip *.app

    # 构建完成后可以下载的文件
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/macos/Build/Products/Release/app.zip