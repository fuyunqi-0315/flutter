workflows:
  build-macos:
    name: Build macOS DMG
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - flutter pub get
      - flutter build macos --release
      - cd build/macos/Build/Products/Release
      - zip -r app.zip *.app

    artifacts:
      - build/macos/Build/Products/Release/app.zip