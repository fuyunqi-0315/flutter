workflows:
  build-macos:
    name: Build macOS DMG
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        APP_NAME: "untitled"
    scripts:
      - name: Enable macOS
        script: flutter config --enable-macos-desktop

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build macOS Release
        script: flutter build macos --release

      - name: Prepare App Bundle
        script: |
          mkdir -p build/dmg
          cp -R build/macos/Build/Products/Release/$APP_NAME.app build/dmg/

      - name: Create DMG Installer
        script: |
          cd build/dmg
          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 150 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 450 150 \
            "$APP_NAME.dmg" \
            "$APP_NAME.app"

    artifacts:
      - build/dmg/*.dmg