workflows:
  build-macos:
    name: Build macOS App
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        APP_NAME: "untitled"
    scripts:
      - name: Enable macOS
        script: flutter config --enable-macos-desktop

      - name: Get Flutter dependencies
        script: flutter pub get

      # 👇 关键：构建时指定架构，兼容虚拟机
      - name: Build macOS Release
        script: flutter build macos --release --arch x86_64

      - name: Zip App Bundle
        script: |
          cd build/macos/Build/Products/Release
          zip -r "$APP_NAME.zip" "$APP_NAME.app"

    artifacts:
      - build/macos/Build/Products/Release/*.zip